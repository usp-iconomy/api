[project]
name = "usp-iconomy-api"
version = "0.1.0"
description = "USP Iconomy API — course platform backed by the Peace Coin community currency"
requires-python = ">=3.13"
dependencies = [
    "falcon>=4.0",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.10",
    "email-validator>=2.2",
    "web3>=7.6",
    "eth-account>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14,<2",
    "pathspec>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iconomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["iconomy"]
