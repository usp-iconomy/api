name: usp-iconomy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iconomy
      POSTGRES_PASSWORD: iconomy
      POSTGRES_DB: iconomy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iconomy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak/realm-iconomy.json:/opt/keycloak/data/import/realm-iconomy.json:ro
      # Login theme built from usp-iconomy/front (keycloak-theme/); see the README.
      - ./infrastructure/keycloak/providers/usp-iconomy-theme.jar:/opt/keycloak/providers/usp-iconomy-theme.jar:ro
    ports:
      - "8080:8080"
    depends_on:
      mailpit: {condition: service_started}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    profiles: ["full"]
    build: .
    command: ["uvicorn", "iconomy.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://iconomy:iconomy@postgres:5432/iconomy
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    profiles: ["full"]
    build: .
    command: ["arq", "iconomy.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://iconomy:iconomy@postgres:5432/iconomy
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
