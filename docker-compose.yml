name: usp-iconomy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iconomy
      POSTGRES_PASSWORD: iconomy
      POSTGRES_DB: iconomy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iconomy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build: .
    command: ["uvicorn", "iconomy.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://iconomy:iconomy@postgres:5432/iconomy
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    profiles: ["full"]
    build: .
    command: ["arq", "iconomy.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://iconomy:iconomy@postgres:5432/iconomy
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
